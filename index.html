<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation Aaliya & Shakthi</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- COVER -->
    <div class="cover" id="cover">
        <div class="ribbon">
            <h1>Wedding Invitation</h1>
            <button onclick="openCard()">Open Invitation</button>
        </div>
    </div>

    <!-- CARD -->
    <div class="card" id="card">

        <div class="card-content">

            <h1 class="couple-names">Aaliya ❤️ Shakthi</h1>

            <p class="invite-text">
                Together with our families,  
                we invite you to celebrate our special day.
            </p>

            <div class="details">
                <h2>📅 Date</h2>
                <p>04 June 2026</p>

                <h2>⏰ Time</h2>
                <p>11:00 AM onwards</p>

                <h2>📍 Venue</h2>
                <p>Royal Kandyan Hotel, Kandy, Sri Lanka</p>
            </div>


            <a href="https://maps.app.goo.gl/BGdbi79MWdCWYL24A" target="_blank" class="location-btn">
                View Location
            </a>

            <p class="footer-text">
                We would be delighted to have you join us on our memorable day.
            </p>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
